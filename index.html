<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신용회복위원회 웹사이트 디자인 쇼케이스</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 헤더 섹션 -->
    <header class="header">
        <div class="container">
            <h1 class="header-title">메인 페이지 유형별 미리보기</h1>
            <p class="header-description">각 이미지를 클릭하여 해당 페이지로 이동하세요</p>
        </div>
    </header>

    <main class="main">

        <!-- 인트로 모달 시연 섹션 -->
        <section class="section modal-section">
            <div class="container">
                <h2 class="section-title">인트로 모달 시연</h2>
                <p class="section-description">시작 화면 모달 기능을 확인해보세요</p>

                <div class="cards-grid">
                    <a href="type_c_intro/index.html" target="_blank" class="card">
                        <div class="card__body">
                            <h3 class="card-title">인트로 레이어 시작화면 시연1</h3>
                            <p class="card-description">C 타입위의 모달방식 1</p>
                        </div>
                    </a>
                    <a href="type_C_intro/html/main/MainPage2.html" target="_blank" class="card">
                        <div class="card__body">
                            <h3 class="card-title">인트로 레이어 시작화면 시연2</h3>
                            <p class="card-description">C 타입위의 모달방식 2</p>
                        </div>
                    </a>
                </div>
            </div>
        </section>

        <!-- 페이지 디자인 유형 섹션 -->
        <section class="section design-section">
            <div class="container">
                <h2 class="section-title">페이지 디자인 유형</h2>
                <p class="section-description">다양한 디자인 유형을 확인해보세요</p>
                
                <div class="cards-grid">
                    <a href="type_a/index.html" target="_blank" class="card design-card">
                        <div class="card-header">
                            <div class="card-icon design-icon">A</div>
                        </div>
                        <div class="card__body">
                            <img src="sample_a.png" alt="" style="max-width: 100%; height: auto;">
                        </div>
                    </a>
                    
                    <!-- <a href="type_b/index.html" target="_blank" class="card design-card">
                        <div class="card-header">
                            <div class="card-icon design-icon">B</div>
                        </div>
                        <div class="card__body">
                            <img src="sample_b.png" alt="" style="max-width: 100%; height: auto;">
                        </div>
                    </a> -->
                    
                    <a href="type_c/index.html" target="_blank" class="card design-card">
                        <div class="card-header">
                            <div class="card-icon design-icon">C</div>
                        </div>
                        <div class="card__body">
                            <img src="sample_c.png" alt="" style="max-width: 100%; height: auto;">
                        </div>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>신용회복위원회 웹사이트의 다양한 디자인 유형을 확인해보세요</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
