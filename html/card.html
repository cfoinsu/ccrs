<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채무 입력 폼</title>
    <style>

        .container {
            position: relative;
            width: 580px;
            height: 550px;
            background-color: #fef8d7;
            border-radius: 24px;
            margin: 0 auto;
        }

        /* Header Section */
        .header {
            position: absolute;
            left: 74px;
            top: 42px;
            width: 200px;
            height: 71px;
        }

        .step-label {
            position: absolute;
            left: 0;
            top: -2px;
            color: #ed7801;
            font-size: 15px;
            font-weight: 400;
            line-height: 1.5;
        }

        .title {
            position: absolute;
            left: 0;
            top: 21px;
            color: #17191b;
            font-size: 32px;
            font-weight: 700;
            line-height: 1.5;
            letter-spacing: 1px;
        }

        /* Cash bag icon */
        /* Form Fields */
        .form-field {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-field.field-1 { left: 74px; top: 150px; }
        .form-field.field-2 { left: 74px; top: 214px; }
        .form-field.field-3 { left: 74px; top: 278px; }
        .form-field.field-4 { left: 74px; top: 342px; }
        .form-field.field-5 { left: 74px; top: 406px; }

        .field-label {
            color: #17191b;
            font-size: 19px;
            font-weight: 700;
            line-height: 1.5;
            white-space: nowrap;
        }

        .help-icon {
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Input Fields */
        .input-group {
            position: absolute;
            width: 220px;
        }

        .input-group.input-1 { left: 286px; top: 139px; }
        .input-group.input-2 { left: 286px; top: 203px; }
        .input-group.input-3 { left: 286px; top: 267px; }
        .input-group.input-4 { left: 286px; top: 331px; }
        .input-group.input-5 { left: 286px; top: 395px; }

        .input-box {
            width: 100%;
            height: 48px;
            background-color: white;
            border-radius: 6px;
            border: none;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            position: relative;
        }

        .input-field {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 17px;
            font-weight: 400;
            color: #17191b;
            text-align: right;
            padding-right: 40px;
        }

        .input-field::placeholder {
            color: #8a949e;
        }

        .unit-text {
            position: absolute;
            right: 16px;
            color: #8a949e;
            font-size: 17px;
            font-weight: 400;
            pointer-events: none;
        }

        /* Select Field */
        .select-box {
            width: 100%;
            height: 48px;
            background-color: white;
            border-radius: 6px;
            border: none;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
        }

        .select-text {
            color: #8a949e;
            font-size: 17px;
            font-weight: 400;
        }

        .arrow-down {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* Next Button */
        .next-button {
            position: absolute;
            left: 420px;
            top: 467px;
            min-width: 78px;
            height: 48px;
            background: transparent;
            border: 1px solid #6d7882;
            border-radius: 6px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
        }

        .next-button:hover {
            background-color: rgba(109, 120, 130, 0.1);
        }

        .button-text {
            color: #17191b;
            font-size: 17px;
            font-weight: 400;
            line-height: 1.5;
        }

        .arrow-right {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .container {
                width: 100%;
                height: auto;
                min-height: 550px;
                border-radius: 0;
                padding: 20px;
            }

            .header {
                position: relative;
                left: 0;
                top: 0;
                margin-bottom: 40px;
            }

            .cash-icon {
                display: none;
            }

            .form-field {
                position: relative;
                left: 0 !important;
                top: 0 !important;
                margin-bottom: 20px;
            }

            .input-group {
                position: relative;
                left: 0 !important;
                top: 0 !important;
                margin-bottom: 30px;
                width: 100%;
            }

            .next-button {
                position: relative;
                left: 0 !important;
                top: 0 !important;
                margin: 20px auto 0;
            }
        }
    </style>
</head>
