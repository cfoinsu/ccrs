<!-- topbanner -->
<div class="top-banner slidetopbox">
	<div class="swiper-container topswiper">
		<div class="swiper-wrapper">
			<div class="swiper-slide">
				<a href="#" aria-label="상단 배너 1">
					<img src="/type/www/images/bg/bg_top_banner01.png?ver=5.5" alt="상단 배너 이미지 1" aria-hidden="true">
				</a>
			</div>
			<div class="swiper-slide">
				<a href="#" aria-label="상단 배너 2">
					<img src="/type/www/images/bg/bg_top_banner01.png?ver=5.5" alt="상단 배너 이미지 2" aria-hidden="true">
				</a>
			</div>
			<!-- <div class="swiper-slide">
				<a href="#" aria-label="상단 배너 2">
					<img src="/type/www/images/bg/bg_top_banner01.png?ver=5.5" alt="상단 배너 이미지 2" aria-hidden="true">
				</a>
			</div>
			<div class="swiper-slide">
				<a href="#" aria-label="상단 배너 2">
					<img src="/type/www/images/bg/bg_top_banner01.png?ver=5.5" alt="상단 배너 이미지 2" aria-hidden="true">
				</a>
			</div> -->
		</div>
		<div class="containe">
			<div class="sw-pagingbox">
				<div class="topswiper-pagination"></div>
				<div class="top-banner-control">
					<button type="button" class="autoplay-toggle on" aria-label="자동재생 일시정지">
						<span class="text sr-only">일시정지</span>
					</button>
				</div>
			</div>
			<div class="top-banner-close">
				<button type="button" class="top-banner-hide-1day" aria-label="1일 동안 보지 않기">
					<span>1일 동안 보지 않기</span>
				</button>
				<button type="button" class="top-banner-close-btn" aria-label="상단 배너 닫기">
					<span class="hide sr-only">배너닫기</span>
					<i class="topbanner_close" aria-hidden="true"></i>
				</button>
			</div>
		</div>
	</div>
	<script>
		// Swiper 초기화
		var slideLength = document.querySelectorAll('.topswiper .swiper-slide').length;
		var topswiper = new Swiper(".topswiper", {
			spaceBetween: 0,
			centeredSlides: true,
			loop: slideLength > 1,          // 1개면 false, 2개 이상부터 loop
			autoplay: slideLength > 1 ? {   // 1개면 autoplay 안씀
				delay: 3000,
				disableOnInteraction: false
			} : false,
			watchOverflow: true,            // 슬라이드 1개면 pager, 버튼 숨김[web:3][web:7]
			allowTouchMove: slideLength > 1,
			// 또는 touchRatio: slideLength > 1 ? 1 : 0,
			pagination: {
			el: ".topswiper-pagination",
			clickable: true,
			bulletClass: 'swiper-pagination-bullet',
			bulletActiveClass: 'swiper-pagination-bullet-active',
			renderBullet: function (index, className) {
				return '<span class="' + className + '" role="button" aria-label="상단 배너 ' + (index + 1) + '번 슬라이드로 이동" tabindex="0"></span>';
			},
			}
		});

		// 토글 버튼 클릭 시 재생/일시정지
		$(document).on('click', '.autoplay-toggle', function() {
			var $btn = $(this);

			if ($btn.hasClass('on')) {
			// 자동재생 중 → 정지
			topswiper.autoplay.stop();
			$btn.removeClass('on').addClass('off').attr('aria-label', '자동재생 시작');
			$btn.find('.text').text('재생');
			} else {
			// 정지 상태 → 재생 시작
			topswiper.autoplay.start();
			$btn.removeClass('off').addClass('on').attr('aria-label', '자동재생 일시정지');
			$btn.find('.text').text('일시정지');
			}
		});
	</script>
</div>
<!-- //topbanner -->
