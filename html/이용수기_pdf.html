<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="format-detection" content="telephone=no, address=no, email=no"/>
    <meta name="keywords" content="신용회복위원회"/>
    <meta name="description" content="신용회복위원회"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>이용수기 - PDF보기</title>
	  <link rel="shortcut icon" type="image/x-icon" href="/type/www/images/favicon/favicon.ico">
    <link rel="stylesheet" href="/type/www/css/common.css?ver=4.2">
    <link rel="stylesheet" href="/type/www/css/component/output.css?ver=4.2">
    <link rel="stylesheet" href="/type/www/css/pdf.css?ver=4.2">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/type/www/css/all.min.css?ver=4.2">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css?ver=4.2">

    <script src="/type/www/js/jquery-2.2.4.min.js?ver=4.2"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js?ver=4.2"></script>
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js?ver=4.2"></script>
</head>
<body>
    <div class="pdf-viewer-container">
        <!-- 사이드바 -->
        <div class="pdf-sidebar">
          <h1>
            <a href="/" class="sidebar-logo">
                <img src="/type/www/images/logo/logo.svg" alt="logo">
            </a>
            
            <div class="sidebar-title">
                <span>이</span>
                <span>용</span>
                <span>수</span>
                <span>기</span>
            </div>
          </h1>
          
          <!-- 페이지 이동 버튼 -->
          <div class="page-nav">
              <button class="page-prev" type="button" onclick="changePage(-1)">
                  <i class="fa-solid fa-angle-left"></i>
              </button>
              <button class="page-next" type="button" onclick="changePage(1)">
                  <i class="fa-solid fa-angle-right"></i>
              </button>
          </div>
          
          <!-- PDF 다운로드 버튼 -->
          <button class="pdf-download-btn" type="button" onclick="downloadPDF()">
              <span>PDF <br> 다운로드</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="17" viewBox="0 0 20 17" fill="none">
<path d="M19.1992 12.2002C19.6409 12.2002 19.9989 12.5583 19.999 13V16.2002C19.999 16.642 19.641 17 19.1992 17H0.799805C0.587668 16.9999 0.384364 16.9156 0.234375 16.7656C0.0844138 16.6156 -3.26416e-05 16.4123 9.46485e-09 16.2002L0.000976572 13C0.0011505 12.5583 0.359084 12.2002 0.800781 12.2002C1.24261 12.2003 1.60069 12.5591 1.60059 13.001V15.4004H18.3994V13C18.3996 12.5583 18.7575 12.2002 19.1992 12.2002ZM9.99902 0C10.4408 0 10.7988 0.358033 10.7988 0.799805V10.5137L14.4229 6.74512C14.7291 6.42694 15.2353 6.4175 15.5537 6.72363C15.872 7.02985 15.8822 7.53606 15.5762 7.85449L10.5762 13.0547C10.4253 13.2116 10.2166 13.2998 9.99902 13.2998C9.78162 13.2998 9.57361 13.2113 9.42285 13.0547L4.42285 7.85449C4.11674 7.53614 4.12624 7.02991 4.44434 6.72363C4.76281 6.41741 5.26993 6.42666 5.57617 6.74512L9.19922 10.5137V0.799805C9.19928 0.358099 9.55733 0.000106154 9.99902 0Z" fill="white"/>
</svg>
          </button>
        </div>
        
        <!-- PDF 콘텐츠 영역 -->
        <div class="pdf-content">
            <!-- Swiper Container -->
            <div class="swiper pdf-swiper">
                <div class="swiper-wrapper" id="pdfSwiperWrapper">
                    <!-- PDF 페이지들이 동적으로 추가됩니다 -->
                </div>
            </div>

            <!-- 페이지 정보 표시 -->
            <div class="page-info">
                <span id="pageNum"></span> / <span id="pageCount"></span>
            </div>
        </div>
    </div>
    
    <script>
        // PDF.js 워커 설정
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // PDF 파일 경로
        const pdfUrl = '/type/www/images/pdf/CCRS_2024_Social_Value_Report_Final.pdf';

        let pdfDoc = null;
        let swiper = null;

        // PDF 페이지 렌더링 (가로/세로 자동 감지)
        function renderPage(pageNum, canvas) {
            return pdfDoc.getPage(pageNum).then(function(page) {
                // 초기 viewport로 페이지 크기 확인
                const initialViewport = page.getViewport({ scale: 1 });
                const pageWidth = initialViewport.width;
                const pageHeight = initialViewport.height;

                // 컨테이너 크기 가져오기 (실제 뷰포트 높이 사용)
                const container = document.querySelector('.pdf-content');
                const containerWidth = container.clientWidth * 1; // 95.02% 사용
                const containerHeight = window.innerHeight * 1; // 화면 높이의 93.02% 사용

                // 페이지 방향 감지 (가로 vs 세로)
                const isLandscape = pageWidth > pageHeight;

                // 방향에 따라 적절한 scale 계산
                let scale;
                if (isLandscape) {
                    // 가로 페이지: 가로를 기준으로 맞춤
                    scale = containerWidth / pageWidth;
                    // 높이도 확인하여 더 작은 값 사용
                    const heightScale = containerHeight / pageHeight;
                    scale = Math.min(scale, heightScale);
                } else {
                    // 세로 페이지: 높이를 기준으로 맞춤
                    scale = containerHeight / pageHeight;
                    // 가로도 확인하여 더 작은 값 사용
                    const widthScale = containerWidth / pageWidth;
                    scale = Math.min(scale, widthScale);
                }

                // 최종 viewport 생성
                const viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: canvas.getContext('2d'),
                    viewport: viewport
                };

                return page.render(renderContext).promise;
            });
        }

        // 모든 PDF 페이지를 Swiper 슬라이드로 생성
        function initPdfSwiper(numPages) {
            const wrapper = document.getElementById('pdfSwiperWrapper');

            // 각 페이지에 대한 슬라이드 생성
            for (let i = 1; i <= numPages; i++) {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';

                const canvas = document.createElement('canvas');
                canvas.id = `pdfCanvas-${i}`;
                canvas.dataset.page = i;

                slide.appendChild(canvas);
                wrapper.appendChild(slide);
            }

            // Swiper 초기화
            swiper = new Swiper('.pdf-swiper', {
                effect: 'slide',
                speed: 500,
                spaceBetween: 30,
                centeredSlides: true,
                slidesPerView: 1,
                keyboard: {
                    enabled: true,
                    onlyInViewport: true,
                },
                mousewheel: {
                    enabled: false,
                },
                on: {
                    slideChange: function() {
                        updatePageInfo();
                        updateButtonState();
                    },
                    slideChangeTransitionStart: function() {
                        // 현재 슬라이드와 다음 슬라이드 렌더링
                        const currentIndex = this.activeIndex;
                        const currentCanvas = document.getElementById(`pdfCanvas-${currentIndex + 1}`);

                        if (currentCanvas && !currentCanvas.dataset.rendered) {
                            renderPage(currentIndex + 1, currentCanvas).then(() => {
                                currentCanvas.dataset.rendered = 'true';
                            });
                        }

                        // 다음 슬라이드 미리 렌더링
                        if (currentIndex + 1 < this.slides.length) {
                            const nextCanvas = document.getElementById(`pdfCanvas-${currentIndex + 2}`);
                            if (nextCanvas && !nextCanvas.dataset.rendered) {
                                renderPage(currentIndex + 2, nextCanvas).then(() => {
                                    nextCanvas.dataset.rendered = 'true';
                                });
                            }
                        }
                    }
                }
            });

            // 첫 번째 페이지 렌더링
            const firstCanvas = document.getElementById('pdfCanvas-1');
            renderPage(1, firstCanvas).then(() => {
                firstCanvas.dataset.rendered = 'true';
            });

            // 두 번째 페이지 미리 렌더링
            if (numPages > 1) {
                const secondCanvas = document.getElementById('pdfCanvas-2');
                renderPage(2, secondCanvas).then(() => {
                    secondCanvas.dataset.rendered = 'true';
                });
            }

            updatePageInfo();
            updateButtonState();
        }

        // 페이지 정보 업데이트
        function updatePageInfo() {
            if (swiper) {
                document.getElementById('pageNum').textContent = swiper.activeIndex + 1;
            }
        }

        // 버튼 상태 업데이트
        function updateButtonState() {
            const prevBtn = document.querySelector('.page-prev');
            const nextBtn = document.querySelector('.page-next');

            if (!swiper) return;

            // 첫 페이지일 때 이전 버튼 비활성화
            if (swiper.isBeginning) {
                prevBtn.disabled = true;
                prevBtn.style.opacity = '0.7';
                prevBtn.style.cursor = 'not-allowed';
            } else {
                prevBtn.disabled = false;
                prevBtn.style.opacity = '1';
                prevBtn.style.cursor = 'pointer';
            }

            // 마지막 페이지일 때 다음 버튼 비활성화
            if (swiper.isEnd) {
                nextBtn.disabled = true;
                nextBtn.style.opacity = '0.5';
                nextBtn.style.cursor = 'not-allowed';
            } else {
                nextBtn.disabled = false;
                nextBtn.style.opacity = '1';
                nextBtn.style.cursor = 'pointer';
            }
        }

        // 페이지 이동
        function changePage(direction) {
            if (!swiper) return;

            if (direction < 0) {
                swiper.slidePrev();
            } else {
                swiper.slideNext();
            }
        }

        // PDF 다운로드
        function downloadPDF() {
            const link = document.createElement('a');
            link.href = pdfUrl;
            link.download = '이용수기.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // PDF 로드
        pdfjsLib.getDocument(pdfUrl).promise.then(function(pdfDoc_) {
            pdfDoc = pdfDoc_;
            document.getElementById('pageCount').textContent = pdfDoc.numPages;

            // Swiper 초기화
            initPdfSwiper(pdfDoc.numPages);
        }).catch(function(error) {
            console.error('PDF 로드 오류:', error);
            alert('PDF 파일을 불러올 수 없습니다.');
        });
    </script>
</body>
</html>
