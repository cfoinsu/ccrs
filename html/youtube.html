<!DOCTYPE html>
<html>
<head>
    <title>연속 영상 자동 재생 - 완벽한 예제</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        #player {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div id="player"></div>

    <script>
      // 1. YouTube IFrame Player API 비동기 로드
      var tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      // 2. 재생할 영상 URL들을 순서대로 배열에 작성
      // 공백 제거를 위해 trim()을 사용합니다.
      var videoUrls = [
          'https://youtu.be/YHjurceKcMM?si=FtV109cgTOrI4-FP'.trim(), 
          'https://youtu.be/8u3PVNy0nRA?si=Cn48wOasr3AoN1rF'.trim(), 
          'https://youtu.be/V5zmJOELZEc?si=r5fxWvyZQ65ZEToy'.trim()
      ];

      var videoIds = [];
      var currentVideoIndex = 0;
      var player;

      // 3. URL에서 영상 ID를 추출하는 함수
      function extractVideoIdFromUrl(url) {
          const urlParts = url.split('/');
          return urlParts[urlParts.length - 1];
      }

      // 4. API 로드 후 플레이어 생성
      function onYouTubeIframeAPIReady() {
          // URL 배열에서 ID를 추출하여 videoIds 배열에 저장
          videoIds = videoUrls.map(extractVideoIdFromUrl);

          player = new YT.Player('player', {
              height: '390',
              width: '640',
              playerVars: {
                  'autoplay': 1, // 자동 재생 활성화
                  'controls': 1, // 컨트롤바 표시
                  'mute': 1 // 💥자동 재생을 위해 필수! 음소거 상태로 재생 시작
              },
              events: {
                  'onReady': onPlayerReady,
                  'onStateChange': onPlayerStateChange
              }
          });
      }

      function onPlayerReady(event) {
          // 플레이어가 준비되면 첫 번째 영상 재생
          if (videoIds.length > 0) {
              event.target.loadVideoById(videoIds[currentVideoIndex]);
          }
      }

      function onPlayerStateChange(event) {
          // 영상 재생이 끝났을 때 다음 영상으로 넘어가기
          if (event.data === YT.PlayerState.ENDED) {
              currentVideoIndex++;
              if (currentVideoIndex < videoIds.length) {
                  player.loadVideoById(videoIds[currentVideoIndex]);
              } else {
                  console.log('모든 영상이 재생되었습니다.');
              }
          }
      }
    </script>

</body>
</html>
