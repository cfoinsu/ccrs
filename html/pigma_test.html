<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신용회복위원회 - 채무조정</title>
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
    <!-- Header -->
    <header class="header-wrap">
        <div class="header-top">
            <div class="inner">
                <ul class="util-menu">
                    <li><a href="#">인증센터</a></li>
                    <li><a href="#">앱 다운로드</a></li>
                    <li><a href="#">상담전화 1600-5500</a></li>
                </ul>
            </div>
        </div>
        <div class="header-main">
            <div class="inner">
                <h1 class="logo"><a href="/">신용회복위원회</a></h1>
                <nav id="gnb">
                    <ul>
                        <li><a href="#">채무조정</a></li>
                        <li><a href="#">상환 가이드</a></li>
                        <li><a href="#">금융생활</a></li>
                        <li><a href="#">알림과 홍보</a></li>
                        <li><a href="#">소통과 참여</a></li>
                        <li><a href="#">위원회 소개</a></li>
                    </ul>
                </nav>
                <div class="header-util">
                    <a href="#" class="btn-lang">EN</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="contents">
        <div class="sub-visual">
            <div class="inner">
                <h2>채무조정</h2>
                <div class="breadcrumb">
                    <span>홈</span>
                    <span>채무조정</span>
                    <span>나에게 맞는 채무조정 찾기</span>
                </div>
            </div>
        </div>

        <div class="content-wrap">
            <div class="inner">
                <!-- Progress Status -->
                <div class="status-box">
                    <strong class="number">9,999</strong>
                    <p>나의 진행상황</p>
                </div>

                <!-- Guide Section -->
                <section class="guide-section">
                    <h3>채무조정 길잡이</h3>
                    <p>간략한 정보를 통해 본인에게 맞는 채무조정제도를 소개합니다.</p>
                    
                    <div class="guide-menu">
                        <a href="#" class="guide-item">채무조정제도란?</a>
                        <a href="#" class="guide-item">나에게 맞는 채무조정 찾기</a>
                        <a href="#" class="guide-item">상담예약신청</a>
                    </div>
                </section>

                <!-- Step Section -->
                <section class="step-section">
                    <h3>맞춤형 채무조정제도</h3>
                    <div class="step-progress">
                        <div class="step active">STEP 01</div>
                        <div class="step">STEP 02</div>
                        <div class="step">STEP 03</div>
                    </div>

                    <div class="debt-form">
                        <h4>채무정보 입력</h4>
                        <form>
                            <div class="form-group">
                                <label>채무액 (무담보)</label>
                                <input type="text" placeholder="만원">
                            </div>
                            <div class="form-group">
                                <label>채무액 (부동산담보)</label>
                                <input type="text" placeholder="만원">
                            </div>
                            <div class="form-group">
                                <label>채무액 (전월세 보증금)</label>
                                <input type="text" placeholder="만원">
                            </div>
                            <div class="form-group">
                                <label>채무액 (차량 대출금)</label>
                                <input type="text" placeholder="만원">
                            </div>
                            <div class="form-group">
                                <label>연체일수</label>
                                <select>
                                    <option>선택해주세요</option>
                                </select>
                            </div>
                            <button type="submit" class="btn-next">다음</button>
                        </form>
                    </div>
                </section>

                <!-- Programs Section -->
                <section class="programs-section">
                    <h3>채무조정제도 더보기</h3>
                    <div class="program-list">
                        <!-- Program Items -->
                        <!-- Add multiple program items here -->
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-wrap">
        <div class="inner">
            <!-- Footer content here -->
        </div>
    </footer>

    <!-- Chat Bot -->
    <div class="chatbot-wrap">
        <button type="button" class="btn-chatbot">챗봇</button>
    </div>
</body>
</html>
