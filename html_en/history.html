            };

            // 연도 범위별 매핑
            const yearRanges = {
                '2023-2021': [2025, 2024, 2023, 2022, 2021],
                '2020-2011': [2020, 2019, 2018, 2017, 2016, 2015, 2014, 2013, 2012, 2011],
                '2010-2002': [2010, 2009, 2008, 2007, 2006, 2005, 2004, 2003, 2002]
            };

            // HTML 생성 함수
            function generateYearSection(year, data) {
                const eventsHtml = data.events.map(event => `
                    <div class="timeline-event-item-flex">
                        <div class="timeline-date-flex">${event.date}</div>
                        <div class="timeline-event-content-flex">${event.content}</div>
                    </div>
                `).join('');

                return `
                    <div class="timeline-year-section">
                        <div class="timeline-image-area">
                            <div class="timeline-image-card">
                                <img alt="${year} history" src="${data.image}" />
                            </div>
                        </div>
                        <div class="timeline-content-area">
                            <div class="timeline-year-header-flex">
                                <div class="timeline-year-icon-flex"></div>
                                <div class="timeline-year-flex">${year}</div>
                            </div>
                            <div class="timeline-events-flex">
                                ${eventsHtml}
                            </div>
                        </div>
                    </div>
                `;
            }

            // 타임라인 콘텐츠 생성 함수
            function generateTimelineContent(yearRange) {
                const years = yearRanges[yearRange];
                const sectionsHtml = years.map(year =>
                    generateYearSection(year, historyData[year])
                ).join('');

                return `<div class="timeline-content-flex">${sectionsHtml}</div>`;
            }

            //  연혁 탭 기능
            $('.year-tab').on('click', function () {
                // 모든 탭에서 active 클래스 제거
                $('.year-tab').removeClass('active');

                // 클릭된 탭에 active 클래스 추가
                $(this).addClass('active');

                // 모든 탭의 스타일 초기화
                $('.year-tab .year-text').css('color', '#8a949e');
                $('.year-tab .year-border').css({
                    'height': '1px',
                    'background-color': '#d2d6da'
                });

                // 활성 탭의 스타일 적용
                $(this).find('.year-text').css('color', '#17191b');
                $(this).find('.year-border').css({
                    'height': '2px',
                    'background-color': '#1b2025'
                });

                // 선택된 연도에 따른 콘텐츠 업데이트
                const selectedYear = $(this).data('year');
                updateTimelineContent(selectedYear);
            });

            // 타임라인 콘텐츠 업데이트 함수
            function updateTimelineContent(yearRange) {
                const $content = $('#timeline-content');
                $content.html(generateTimelineContent(yearRange));
            }

            // 페이지 로드 시 기본 콘텐츠 표시
            updateTimelineContent('2023-2021');
        });
