<!-- 개발중복 제거요소 -->
<script>
    $("#plusClick").on("click",function(){
		let ua = window.navigator.userAgent.toLowerCase();
		
		if(ua.indexOf("android") > -1){
	    	location.href = 'intent://creditplusapp#Intent;package=kr.or.ccrs.ccpm;scheme=ccpm;end';
		}else{
			
			setTimeout(function(){
				let url = 'https://apps.apple.com/kr/app/신용플러스-creditplus/id1665482651';
				url = encodeURI(url)
				location.href = url;
			}, 1500);
		}
	});
</script>
