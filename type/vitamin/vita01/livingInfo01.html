<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신용비타민</title>
    <link rel="stylesheet" href="/type/www/css/bundle.css?ver=5.9">
</head>

<body>
    <div style="text-align:center;" class="vita">
        <img alt="" src="/type/vitamin/vita01/vita_v1.jpg" width="350" height="707" style="text-align:center;"
            usemap="#map1">
        <map id="map1" name="map1">
            <area shape="rect" alt="통장을 쓸 수 있나요?" coords="17,226,332,336"
                href="/type/vitamin/vita01/livingInfo01_2.html">
            <area shape="rect" alt="빠진 채무가 있어요" coords="17,347,330,458" href="/type/vitamin/vita01/livingInfo01_3.html">
            <area shape="rect" alt="채무조정 이용자 필수지식 " coords="17,504,331,559"
                href="https://youtu.be/2sJzC4bxkXg?si=h7OUHdkL_mMkw8-p" target="_blank" title="새창열림">
        </map>
    </div>
    <!-- Feedback Section -->
    <div style="width: 350px;margin: 0 auto;">

        <div class="feedback-section noprint">
            <div class="feedback-card">
                <h3>이 페이지에서 제공하는 정보에 대하여 어느 정도 만족하셨습니까?</h3>
                <div class="rating-options" role="radiogroup" aria-label="만족도 평가">
                    <label class="rating-option">
                        <input type="radio" name="satisfaction" value="5" aria-label="매우 만족">
                        <span class="radio-custom" aria-hidden="true"></span>
                        매우 만족
                    </label>
                    <label class="rating-option">
                        <input type="radio" name="satisfaction" value="4" aria-label="만족">
                        <span class="radio-custom" aria-hidden="true"></span>
                        만족
                    </label>
                    <label class="rating-option">
                        <input type="radio" name="satisfaction" value="3" aria-label="보통">
                        <span class="radio-custom" aria-hidden="true"></span>
                        보통
                    </label>
                    <label class="rating-option">
                        <input type="radio" name="satisfaction" value="2" aria-label="불만족">
                        <span class="radio-custom" aria-hidden="true"></span>
                        불만족
                    </label>
                    <label class="rating-option">
                        <input type="radio" name="satisfaction" value="1" aria-label="매우 불만족">
                        <span class="radio-custom" aria-hidden="true"></span>
                        매우 불만족
                    </label>
                </div>
                <div class="feedback-input">
                    <label class="hide" for="feedback-text">의견 입력</label>
                    <textarea id="feedback-text" placeholder="내용을 입력하세요" rows="1" aria-label="의견 입력"></textarea>
                    <button type="button" class="submit-btn" aria-label="의견 제출">제출</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
